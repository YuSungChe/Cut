<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TXT 排序／切割工具</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px 40px}
  h1{font-size:25px;margin:4px 0 6px}
  .sub{color:#6e6e73;font-size:14px;margin-bottom:20px}
  .card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
  label{display:block;font-weight:600;margin-bottom:9px}
  input[type=file]{width:100%;padding:12px;border:1px solid #d2d2d7;border-radius:12px;background:#fff}
  input[type=number]{width:100%;font-size:18px;padding:13px;border:1px solid #d2d2d7;border-radius:12px}
  textarea{width:100%;height:90px;font-size:14px;padding:10px;border:1px solid #d2d2d7;border-radius:12px;font-family:ui-monospace,Menlo,monospace}
  button{width:100%;border:0;border-radius:13px;padding:14px 16px;font-size:17px;font-weight:700;margin-top:10px;background:#007aff;color:white}
  button.secondary{background:#34c759}
  button:disabled{opacity:.45}
  .status{white-space:pre-wrap;line-height:1.55;color:#6e6e73;font-size:14px}
  .ok{color:#16803c}
  .err{color:#d70015}
  .files a{display:block;padding:12px 0;border-bottom:1px solid #eee;color:#007aff;text-decoration:none;word-break:break-all}
  .files a:last-child{border-bottom:0}
  .hint{font-size:13px;color:#6e6e73;line-height:1.5;margin-top:10px}
  .progress{height:8px;background:#e5e5ea;border-radius:8px;overflow:hidden;margin-top:12px}
  .bar{height:100%;width:0;background:#007aff;transition:width .15s}
  .preview{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f5f5f7;border-radius:10px;padding:10px;margin-top:10px;white-space:pre;overflow-x:auto;display:none}
  details summary{font-size:13px;color:#6e6e73;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>TXT 排序／切割工具</h1>
  <div class="sub">讀取 TXT → 由最左欄起數字由小到大排列 → 依筆數切割成多個 TXT。</div>

  <div class="card">
    <label>① 選取 TXT 檔案</label>
    <input id="file" type="file">
    <div id="fileInfo" class="hint">尚未選擇檔案</div>
    <details>
      <summary>選檔沒反應？可改為直接貼上資料</summary>
      <textarea id="paste" placeholder="把 TXT 內容貼在這裡"></textarea>
      <button id="clipBtn" type="button" style="background:#8e8e93;font-size:15px;padding:11px">從剪貼簿貼上</button>
    </details>
    <div id="diag" class="hint" style="font-size:12px"></div>
  </div>

  <div class="card">
    <label>② 升序排列</label>
    <button id="sortBtn">讀取並升序排列</button>
    <div id="sortStatus" class="status" style="margin-top:10px">尚未排序</div>
    <div id="preview" class="preview"></div>
  </div>

  <div class="card">
    <label>③ 幾筆資料切割為一個 TXT？</label>
    <input id="chunk" type="number" min="1" step="1" value="1000" inputmode="numeric">
    <div class="hint">例如輸入 1000，就是每 1000 筆（行）切成一個 TXT。</div>
    <button id="splitBtn" class="secondary">切割</button>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="splitStatus" class="status" style="margin-top:10px"></div>
  </div>

  <div id="downloads" class="card files" style="display:none">
    <label>④ 點擊檔案下載／儲存</label>
    <button id="zipBtn" type="button">📦 全部打包成一個 ZIP 下載</button>
    <div id="fileList" style="margin-top:6px"></div>
    <div class="hint">點擊檔案或 ZIP 後會跳出確認視窗，按確認即可儲存到「檔案」。</div>
  </div>
</div>

<script>
let lines=[];
let sorted=false;
let generated=[];
let lastSig='';
let dl=null;           // 平台提供的下載功能（在已發布網頁中才有）
let entries=[];        // 切割後的檔案內容，供 ZIP 使用
try{ if(window.claude&&claude.use) claude.use('downloads').then(d=>{dl=d||null;}).catch(()=>{}); }catch(e){}

const $=id=>document.getElementById(id);
const fileInput=$('file'), sortBtn=$('sortBtn'), splitBtn=$('splitBtn');
const fileInfo=$('fileInfo'), sortStatus=$('sortStatus'), splitStatus=$('splitStatus');
const bar=$('bar'), downloads=$('downloads'), fileList=$('fileList'), preview=$('preview');

// 取得目前選取的檔案（每次都即時讀取，不依賴 change 事件）
function getFile(){
  return (fileInput.files && fileInput.files.length) ? fileInput.files[0] : null;
}

// 偵測檔案是否變更（change/input 事件、焦點回來、定時檢查，多重保險）
function refreshFile(){
  const f=getFile();
  $('diag').textContent=`［診斷］input.files 數量：${fileInput.files?fileInput.files.length:'不支援'}；欄位值：${fileInput.value||'(空)'}`;
  const sig=f?`${f.name}|${f.size}|${f.lastModified}`:'';
  if(sig===lastSig) return;
  lastSig=sig;
  lines=[]; sorted=false;
  clearDownloads();
  bar.style.width='0%';
  preview.style.display='none';
  splitStatus.textContent='';
  sortStatus.textContent='尚未排序';
  fileInfo.textContent=f?`已選取：${f.name}（${formatBytes(f.size)}）`:'尚未選擇檔案';
}
['change','input','focus','click'].forEach(ev=>fileInput.addEventListener(ev,()=>setTimeout(refreshFile,50)));
window.addEventListener('focus',refreshFile);
document.addEventListener('visibilitychange',refreshFile);
setInterval(refreshFile,500);

$('clipBtn').addEventListener('click',async()=>{
  try{
    const t=await navigator.clipboard.readText();
    $('paste').value=t;
    sortStatus.textContent=`已貼上 ${t.split(/\r?\n/).filter(x=>x.trim()).length.toLocaleString()} 行，請按「讀取並升序排列」`;
  }catch(e){ alert('無法讀取剪貼簿，請長按文字框手動貼上。'); }
});

sortBtn.addEventListener('click',async()=>{
  refreshFile();
  const f=getFile();
  const pasted=$('paste').value;
  if(!f && !pasted.trim()){
    alert(fileInput.value
      ? '這個瀏覽器沒有把檔案內容交給網頁（iRAR 內建瀏覽器的限制）。請改用 Safari 開啟此工具，或展開「選檔沒反應？」直接貼上資料。'
      : '請先選取 TXT 檔案（或貼上資料）。');
    return;
  }
  try{
    sortBtn.disabled=true;
    sortStatus.className='status';
    sortStatus.textContent='正在讀取 TXT…';
    const text=f?await readText(f):pasted;
    lines=text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x!=='');
    if(!lines.length) throw new Error('檔案沒有任何資料');
    sortStatus.textContent=`正在排序 ${lines.length.toLocaleString()} 筆…`;
    await new Promise(r=>setTimeout(r,30));
    // 預先解析欄位，避免排序時重複解析
    const rows=lines.map(s=>({s,k:parseKey(s)}));
    rows.sort(compareRow);
    lines=rows.map(r=>r.s);
    sorted=true;
    sortStatus.innerHTML=`<span class="ok">✓ 排序完成，共 ${lines.length.toLocaleString()} 筆</span>`;
    const head=lines.slice(0,5), tail=lines.length>10?lines.slice(-3):[];
    preview.textContent=head.join('\n')+(tail.length?'\n…\n'+tail.join('\n'):'');
    preview.style.display='block';
    clearDownloads(); bar.style.width='0%'; splitStatus.textContent='';
  }catch(e){
    sortStatus.innerHTML=`<span class="err">讀取或排序失敗：${e.message}</span>`;
  }finally{
    sortBtn.disabled=false;
  }
});

splitBtn.addEventListener('click',()=>{
  if(!sorted||!lines.length){ alert('請先按「讀取並升序排列」。'); return; }
  const n=parseInt($('chunk').value,10);
  if(!Number.isInteger(n)||n<=0){ alert('請輸入大於 0 的整數。'); return; }

  clearDownloads();
  downloads.style.display='block';

  const f=getFile();
  const base=f?f.name.replace(/\.txt$/i,''):'data';
  const total=Math.ceil(lines.length/n);
  const width=Math.max(3,String(total).length);

  for(let i=0;i<total;i++){
    const part=lines.slice(i*n,i*n+n);
    const num=String(i+1).padStart(width,'0');
    addDownload(`${base}_sorted_${num}.txt`,part.join('\n')+'\n');
    bar.style.width=((i+1)/total*100)+'%';
  }
  splitStatus.innerHTML=`<span class="ok">✓ 完成！共 ${lines.length.toLocaleString()} 筆，每 ${n.toLocaleString()} 筆一檔，產生 ${total.toLocaleString()} 個 TXT。</span>`;
});

// 將一行依分隔符（| , ; Tab 空白）拆成欄位，由左到右
function parseKey(s){
  return s.split(/[|,;\t\s]+/).filter(x=>x!=='');
}

// 由最左欄開始逐欄比較：兩欄都是數字 → 數值由小到大；否則用文字比較；相同再比下一欄
function compareRow(a,b){
  const A=a.k, B=b.k;
  const len=Math.min(A.length,B.length);
  for(let i=0;i<len;i++){
    const x=A[i], y=B[i];
    if(x===y) continue;
    const nx=/^-?\d+(\.\d+)?$/.test(x), ny=/^-?\d+(\.\d+)?$/.test(y);
    if(nx&&ny){
      const d=parseFloat(x)-parseFloat(y);
      if(d!==0) return d;
    }else if(nx!==ny){
      return nx?-1:1; // 數字排在文字前面
    }else{
      const c=x.localeCompare(y,'zh-Hant',{numeric:true,sensitivity:'base'});
      if(c!==0) return c;
    }
  }
  return A.length-B.length;
}

function clearDownloads(){
  generated.forEach(x=>URL.revokeObjectURL(x.url));
  generated=[];
  entries=[];
  fileList.innerHTML='';
  downloads.style.display='none';
}

function addDownload(name,text){
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  generated.push({url,name});
  entries.push({name,text});
  const a=document.createElement('a');
  a.href=url; a.download=name; a.textContent='⬇ '+name;
  a.addEventListener('click',async ev=>{
    if(!dl) return;                    // 沒有 downloads 功能 → 走一般下載
    ev.preventDefault();
    await saveViaPlatform(name,text);
  });
  fileList.appendChild(a);
}

async function saveViaPlatform(name,data){
  try{
    await dl.save({filename:name,data});
  }catch(e){
    if(e&&e.code==='declined') return;
    alert('儲存失敗：'+((e&&e.message)||e));
  }
}

// ---------- 簡易 ZIP（不壓縮，支援中文檔名）----------
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=crcTable[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function buildZip(files){
  const enc=new TextEncoder(), now=new Date();
  const dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dosDate=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  const parts=[], central=[];
  let offset=0;
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,dosTime,true); lh.setUint16(12,dosDate,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,dosTime,true); ch.setUint16(14,dosDate,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+data.length;
  }
  let cdSize=0; central.forEach(c=>cdSize+=c.length);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
}

$('zipBtn').addEventListener('click',async()=>{
  if(!entries.length) return;
  const f=getFile();
  const base=f?f.name.replace(/\.txt$/i,''):'data';
  const blob=buildZip(entries);
  const name=`${base}_sorted.zip`;
  if(dl){ await saveViaPlatform(name,blob); return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
});

// 用 FileReader 讀取（相容性比 file.arrayBuffer() 好）
function readBuffer(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(new Error('無法讀取檔案'));
    r.readAsArrayBuffer(file);
  });
}

async function readText(file){
  const buf=await readBuffer(file);
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){}
  try{ return new TextDecoder('big5',{fatal:true}).decode(buf); }catch(e){}
  return new TextDecoder('utf-8').decode(buf);
}

function formatBytes(n){
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(1)+' MB';
}
</script>
</body>
</html>
